<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fire Burn Simulator 🔥</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game-canvas {
      display: block;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    #admin-root {
      display: none;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 100;
      background: rgba(0,0,0,0.85);
      overflow-y: auto;
    }
    #touch-controls {
      display: none;
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 50;
      pointer-events: none;
    }
    #joystick-zone {
      position: absolute;
      bottom: 20px; left: 20px;
      width: 140px; height: 140px;
      pointer-events: auto;
    }
    #action-btn {
      position: absolute;
      bottom: 40px; right: 40px;
      width: 70px; height: 70px;
      border-radius: 50%;
      background: rgba(255,100,0,0.6);
      border: 3px solid rgba(255,200,0,0.8);
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="admin-root"></div>
  <div id="touch-controls">
    <div id="joystick-zone"></div>
    <div id="action-btn">LAY<br>DOWN</div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
